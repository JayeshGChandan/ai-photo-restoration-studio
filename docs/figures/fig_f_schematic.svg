<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15">
<title>Raw LaMa round trip vs composite</title>
<rect width="1000" height="330" fill="#fcfcfb"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="215" y="26" fill="#52514e" font-size="14">Raw LaMa round trip</text>
<text x="605" y="290" fill="#52514e" font-size="14">Composite</text>
<rect x="20" y="120" width="150" height="60" rx="6" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="95.0" y="145.5" text-anchor="middle" fill="#0b0b0b" font-weight="600">Damaged image D</text>
<text x="95.0" y="164.5" text-anchor="middle" fill="#0b0b0b">+ mask M</text>
<rect x="215" y="40" width="150" height="60" rx="6" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="290.0" y="65.5" text-anchor="middle" fill="#0b0b0b" font-weight="600">Downscale to</text>
<text x="290.0" y="84.5" text-anchor="middle" fill="#0b0b0b">1536 px</text>
<rect x="410" y="40" width="150" height="60" rx="6" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="485.0" y="65.5" text-anchor="middle" fill="#0b0b0b" font-weight="600">LaMa</text>
<text x="485.0" y="84.5" text-anchor="middle" fill="#0b0b0b">fills M</text>
<rect x="605" y="40" width="150" height="60" rx="6" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="680.0" y="65.5" text-anchor="middle" fill="#0b0b0b" font-weight="600">Upscale to</text>
<text x="680.0" y="84.5" text-anchor="middle" fill="#0b0b0b">full size</text>
<rect x="800" y="40" width="180" height="60" rx="6" fill="#fcfcfb" stroke="#1baf7a" stroke-width="2"/>
<text x="890.0" y="65.5" text-anchor="middle" fill="#0b0b0b" font-weight="600">N1</text>
<text x="890.0" y="84.5" text-anchor="middle" fill="#0b0b0b">raw LaMa output</text>
<rect x="605" y="200" width="150" height="60" rx="6" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="680.0" y="225.5" text-anchor="middle" fill="#0b0b0b" font-weight="600">Composite into D</text>
<text x="680.0" y="244.5" text-anchor="middle" fill="#0b0b0b">feather outside M</text>
<rect x="800" y="200" width="180" height="60" rx="6" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/>
<text x="890.0" y="225.5" text-anchor="middle" fill="#0b0b0b" font-weight="600">C_3</text>
<text x="890.0" y="244.5" text-anchor="middle" fill="#0b0b0b">composite output</text>
<path d="M170,150.0 L192.5,150.0 L192.5,70.0 L213,70.0" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M365,70.0 L408,70.0" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M560,70.0 L603,70.0" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M755,70.0 L798,70.0" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M680.0,100 L680.0,198" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M755,230.0 L798,230.0" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M95.0,180 L95.0,230.0 L603,230.0" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="688.0" y="150" fill="#52514e" font-size="13">L</text>
</svg>
